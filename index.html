<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14284b" />
    <meta name="description" content="Aula Virtual de Física: teoría, ejercicios con corrección automática y laboratorio virtual." />
    <title>Aula Virtual de Física</title>
    <script>
      // Aplica el tema antes de pintar para evitar el destello claro en modo oscuro.
      try {
        var t = localStorage.getItem('aula-tema');
        if (t === 'oscuro' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-papel text-tinta dark:bg-noche dark:text-gray-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
