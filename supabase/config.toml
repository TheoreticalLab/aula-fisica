# Configuración mínima para la CLI de Supabase (npx supabase link / db push / functions deploy).
project_id = "aula-fisica-basica"

[functions.calificar]
# La comprobación automática de la pasarela no es compatible con las nuevas claves de firma (JWT signing keys)
# de los proyectos recientes. La función verifica ella misma la sesión con auth.getUser() y rechaza
# cualquier petición sin un usuario válido (ver supabase/functions/calificar/index.ts).
verify_jwt = false

[functions.entregas]
# Igual que «calificar»: verifica la sesión con auth.getUser() (supabase/functions/entregas/index.ts).
verify_jwt = false

[functions.recuperar]
# Recuperación supervisada: la usan estudiantes SIN sesión (como «acceder»). Toda autorización la decide la base
# (svc_acceso_*: solo service_role) y el canje exige el secreto del dispositivo (supabase/functions/recuperar/handler.ts).
verify_jwt = false

[functions.orbe-ia]
# Igual que «calificar»: verifica la sesión con auth.getUser() (supabase/functions/orbe-ia/index.ts).
verify_jwt = false
